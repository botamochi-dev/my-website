name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 同じブランチで複数のジョブが実行されないようにする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI はコードを読むだけなので、トークンの権限は読み取りに絞る
permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node のバージョンは .node-version に揃える（Vercel・手元と同じ版でビルドする）
      - name: Use Node.js from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
